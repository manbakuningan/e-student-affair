   KONEKSI BACKEND (Google Apps Script Web App)

const API_URL = 'https://script.google.com/macros/s/AKfycbz9FMYZJdbhPreicdD9mOrbuGBnXaysMNFbsZpQ4UxpUPeNdPQV7qFHKmQ3c985z2Afhg/exec'; // hasil deploy Code.gs, diakhiri /exec

async function callGAS(fn, ...args) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ fn, args })
  });
  if (!res.ok) throw new Error('Network error: ' + res.status);
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json.result;
}

/* ============================================================
   STATE
   ============================================================ */
let currentUser = null;
let currentModuleKey = null;
let moduleCache = {}; // { key: [records] }
let modSearchTerm = '';

document.getElementById('headerDate').textContent = new Date().toLocaleDateString('id-ID', { weekday:'long', year:'numeric', month:'long', day:'numeric' });

/* ============================================================
   AUTH
   ============================================================ */
function checkSession() {
  const s = localStorage.getItem('esiswaSession');
  if (!s) return;
  try {
    const data = JSON.parse(s);
    if (data && data.success) { currentUser = data; enterDashboard(); }
  } catch(e) { localStorage.removeItem('esiswaSession'); }
}

function handleLogin(e) {
  e.preventDefault();
  showLoading();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  callGAS('login', username, password).then(res => {
    hideLoading();
    if (res.success) {
      currentUser = res;
      localStorage.setItem('esiswaSession', JSON.stringify(res));
      enterDashboard();
    } else {
      const el = document.getElementById('loginError');
      el.textContent = res.message || 'Login gagal';
      el.classList.remove('hidden');
    }
  }).catch(err => { hideLoading(); showAlert('error', 'Gagal koneksi: ' + err.message); });
}

function logout() {
  localStorage.removeItem('esiswaSession');
  currentUser = null;
  document.getElementById('dashboardContainer').classList.add('hidden');
  document.getElementById('loginPage').classList.remove('hidden');
  document.getElementById('username').value = '';
  document.getElementById('password').value = '';
}

function enterDashboard() {
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('dashboardContainer').classList.remove('hidden');
  if (window.innerWidth < 768) document.getElementById('sidebar').classList.add('-translate-x-full');

  document.getElementById('navUserName').textContent = currentUser.nama || currentUser.username;
  document.getElementById('navUserRole').textContent = roleLabel(currentUser.role).toUpperCase();
  document.getElementById('navUserInitial').textContent = (currentUser.nama || currentUser.username).charAt(0).toUpperCase();

  buildSidebar();
  loadDashboard();
}

/* ============================================================
   SIDEBAR
   ============================================================ */
function buildSidebar() {
  const role = currentUser.role;
  const menu = document.getElementById('sidebarMenu');
  const item = (label, icon, onclick, active=false) => `
    <a data-name="${label}" onclick="${onclick}" class="flex items-center space-x-3 px-4 py-3 rounded-xl transition-all cursor-pointer text-xs font-medium ${active?'bg-indigo-600 text-white shadow-lg':'text-indigo-100/70 hover:bg-white/10 hover:text-white'}">
      <i class="fas ${icon} w-5 text-center"></i><span>${label}</span>
    </a>`;
  let html = item('Dashboard','fa-house','loadDashboard()', true);
  Object.entries(MODULES).forEach(([key, mod]) => {
    if (role === 'admin' || mod.roles.includes(role)) {
      html += item(mod.label, mod.icon, `openModule('${key}')`);
    }
  });
  menu.innerHTML = html;
}

function setActiveMenu(label) {
  document.querySelectorAll('#sidebarMenu a').forEach(a => {
    const active = a.getAttribute('data-name') === label;
    a.className = `flex items-center space-x-3 px-4 py-3 rounded-xl transition-all cursor-pointer text-xs font-medium ${active?'bg-indigo-600 text-white shadow-lg':'text-indigo-100/70 hover:bg-white/10 hover:text-white'}`;
  });
}

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('mobileOverlay');
  if (window.innerWidth < 768) {
    if (sidebar.classList.contains('-translate-x-full')) {
      sidebar.classList.remove('-translate-x-full'); overlay.classList.remove('hidden');
    } else {
      sidebar.classList.add('-translate-x-full'); overlay.classList.add('hidden');
    }
  }
}

function showView(id) {
  document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (window.innerWidth < 768) document.getElementById('sidebar').classList.add('-translate-x-full');
}

/* ============================================================
   DASHBOARD
   ============================================================ */
function loadDashboard() {
  setActiveMenu('Dashboard');
  document.getElementById('pageTitle').textContent = 'Dashboard';
  showView('view-dashboard');
  const grid = document.getElementById('dashboardStatsGrid');
  grid.innerHTML = '<div class="col-span-full text-center py-10 text-gray-400"><i class="fas fa-circle-notch fa-spin mr-2"></i>Memuat statistik...</div>';

  const role = currentUser.role;
  const visibleModules = Object.entries(MODULES).filter(([k,m]) => role === 'admin' || m.roles.includes(role));

  callGAS('getDashboardStats').then(stats => {
    if (visibleModules.length === 0) {
      grid.innerHTML = '<div class="col-span-full text-center py-10 text-gray-400">Tidak ada modul yang tersedia untuk peran Anda.</div>';
      return;
    }
    grid.innerHTML = visibleModules.map(([key, mod]) => `
      <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 relative overflow-hidden group cursor-pointer" onclick="openModule('${key}')">
        <div class="absolute right-0 top-0 w-16 h-16 bg-indigo-50 rounded-bl-full -mr-2 -mt-2 group-hover:scale-110 transition-transform"></div>
        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest relative z-10">${mod.label}</p>
        <div class="flex items-center justify-between mt-2 relative z-10">
          <h3 class="text-2xl font-bold text-gray-800">${stats[mod.sheet] ?? 0}</h3>
          <div class="text-indigo-500 bg-indigo-50 p-2 rounded-lg"><i class="fas ${mod.icon}"></i></div>
        </div>
      </div>`).join('');
  }).catch(err => {
    grid.innerHTML = `<div class="col-span-full text-center py-10 text-red-400">Gagal memuat statistik: ${err.message}</div>`;
  });
}

/* ============================================================
   MODUL — GENERIC LIST / CRUD
   ============================================================ */
function openModule(key) {
  // Guard: pastikan role user berhak mengakses modul ini
  const mod = MODULES[key];
  if (!mod || (currentUser.role !== 'admin' && !mod.roles.includes(currentUser.role))) {
    showAlert('error', 'Anda tidak memiliki akses ke modul ini.');
    return;
  }
  currentModuleKey = key;
  modSearchTerm = '';
  setActiveMenu(mod.label);
  document.getElementById('pageTitle').textContent = mod.label;
  document.getElementById('modTitle').textContent = mod.label;
  document.getElementById('modDesc').textContent = mod.desc;
  document.getElementById('modSearch').value = '';
  showView('view-module');
  renderModuleHead();
  loadModuleData();
  renderModuleQrButton();
}

function renderModuleQrButton() {
  const mod = MODULES[currentModuleKey];
  const existing = document.getElementById('modQrBtn');
  if (existing) existing.remove();
  if (!mod.qrEnabled) return;
  const btn = document.createElement('button');
  btn.id = 'modQrBtn';
  btn.className = 'bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm hover:bg-emerald-700';
  btn.innerHTML = '<i class="fas fa-qrcode mr-1"></i> Scan QR';
  btn.onclick = scanForModule;
  document.getElementById('modToolbarExtra').prepend(btn);
}

function scanForModule() {
  openQrScanner(code => {
    lookupStudentByQr(code, siswa => showStudentDetailForModule(siswa));
  });
}

function showStudentDetailForModule(siswa) {
  const mod = MODULES[currentModuleKey];
  const displayLabels = {
    nisn: 'NISN', namaSiswa: 'Nama Siswa', kelas: 'Kelas',
    jenisKelamin: 'Jenis Kelamin', noHp: 'No. HP', alamat: 'Alamat', qrId: 'Kode QR'
  };
  const hiddenKeys = ['id', 'nama'];
  const detailRows = Object.keys(displayLabels)
    .filter(k => siswa[k] !== undefined && !hiddenKeys.includes(k))
    .map(k => `
      <div class="flex justify-between gap-3 py-1.5 border-b border-gray-50 last:border-0">
        <span class="text-[11px] text-gray-500 font-semibold">${displayLabels[k]}</span>
        <span class="text-xs text-gray-800 text-right">${escapeHtml(String(siswa[k] || '-'))}</span>
      </div>`).join('');

  showModal(`
    <div class="bg-white rounded-2xl shadow-2xl overflow-hidden max-w-md w-full mx-auto">
      <div class="p-6 border-b border-gray-100 bg-gray-50/50">
        <h3 class="text-lg font-bold text-gray-800 mb-1"><i class="fas fa-id-card mr-2 text-indigo-600"></i>Data Siswa Ditemukan</h3>
        <p class="text-sm text-gray-700 font-semibold">${escapeHtml(siswa.namaSiswa || '-')}</p>
      </div>
      <div class="p-6">
        <div class="bg-gray-50/60 border border-gray-100 rounded-xl p-3 mb-4">${detailRows}</div>
        <div class="flex justify-end gap-3">
          <button onclick="closeModal()" class="px-5 py-2.5 rounded-xl text-gray-600 font-medium hover:bg-gray-100">Batal</button>
          <button onclick='closeModal(); openRecordModal(null, ${JSON.stringify(siswa)});' class="px-5 py-2.5 bg-indigo-600 text-white rounded-xl font-bold shadow-lg hover:bg-indigo-700"><i class="fas fa-arrow-right mr-1"></i> Isi ke Form ${mod.label}</button>
        </div>
      </div>
    </div>`);
}

function refreshModule() { moduleCache[currentModuleKey] = null; loadModuleData(); }

function renderModuleHead() {
  const mod = MODULES[currentModuleKey];
  const thead = document.getElementById('modThead');
  let html = '<tr><th class="p-3 text-center w-10">No</th>';
  mod.fields.forEach(f => html += `<th class="p-3">${f.label}</th>`);
  html += '<th class="p-3 text-center w-24">Aksi</th></tr>';
  thead.innerHTML = html;
}

function loadModuleData() {
  const tbody = document.getElementById('modTbody');
  const mod = MODULES[currentModuleKey];
  tbody.innerHTML = `<tr><td colspan="${mod.fields.length+2}" class="p-8 text-center text-gray-400"><i class="fas fa-circle-notch fa-spin mr-2"></i>Memuat data...</td></tr>`;

  if (moduleCache[currentModuleKey]) { renderModuleRows(); return; }

  callGAS('getList', mod.sheet).then(res => {
    if (!res.success) { tbody.innerHTML = `<tr><td colspan="100%" class="p-4 text-center text-red-500">${res.message}</td></tr>`; return; }
    moduleCache[currentModuleKey] = res.data;
    renderModuleRows();
  }).catch(err => { tbody.innerHTML = `<tr><td colspan="100%" class="p-4 text-center text-red-500">Gagal koneksi: ${err.message}</td></tr>`; });
}

function onModSearch(val) { modSearchTerm = val.toLowerCase(); renderModuleRows(); }

function renderModuleRows() {
  const mod = MODULES[currentModuleKey];
  const tbody = document.getElementById('modTbody');
  let data = moduleCache[currentModuleKey] || [];
  if (modSearchTerm) {
    data = data.filter(row => Object.values(row).some(v => String(v).toLowerCase().includes(modSearchTerm)));
  }
  document.getElementById('modInfo').textContent = data.length + ' data';

  if (data.length === 0) {
    tbody.innerHTML = `<tr><td colspan="${mod.fields.length+2}" class="p-8 text-center text-gray-400">Tidak ada data.</td></tr>`;
    return;
  }

  tbody.innerHTML = data.map((row, i) => {
    let tds = `<td class="p-3 text-center text-gray-400">${i+1}</td>`;
    mod.fields.forEach(f => {
      let val = row[f.key] ?? '-';
      if (f.type === 'textarea' && val && String(val).length > 40) val = String(val).slice(0,40) + '…';
      tds += `<td class="p-3 text-gray-700">${escapeHtml(String(val))}</td>`;
    });
    tds += `<td class="p-3 text-center">
      <div class="flex justify-center gap-2">
        <button onclick='openRecordModal(${JSON.stringify(row).replace(/'/g,"&apos;")})' class="p-2 bg-amber-50 text-amber-600 rounded-lg hover:bg-amber-100" title="Edit"><i class="fas fa-edit"></i></button>
        <button onclick="deleteRecord('${row.id}')" class="p-2 bg-red-50 text-red-600 rounded-lg hover:bg-red-100" title="Hapus"><i class="fas fa-trash"></i></button>
      </div></td>`;
    return `<tr class="hover:bg-gray-50 transition">${tds}</tr>`;
  }).join('');
}

function escapeHtml(str) { return str.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- Modal add/edit (auto-generated dari config field) ---------- */
function openRecordModal(record = null, prefill = null) {
  const mod = MODULES[currentModuleKey];
  const isEdit = record !== null;
  const inputClass = "w-full bg-gray-50 border border-gray-200 text-gray-900 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block p-2.5 mb-4";

  let fieldsHtml = mod.fields.map(f => {
    const val = isEdit ? (record[f.key] ?? '') : (prefill && prefill[f.key] !== undefined ? prefill[f.key] : '');
    let inputHtml = '';
    if (f.type === 'textarea') {
      inputHtml = `<textarea name="${f.key}" rows="2" class="${inputClass}" ${f.required?'required':''} placeholder="${f.placeholder||''}">${val}</textarea>`;
    } else if (f.type === 'select') {
      inputHtml = `<select name="${f.key}" class="${inputClass}" ${f.required?'required':''}>
        <option value="">-- Pilih --</option>
        ${f.options.map(o => `<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}
      </select>`;
    } else {
      inputHtml = `<input type="${f.type}" name="${f.key}" value="${val}" class="${inputClass}" ${f.required?'required':''} placeholder="${f.placeholder||''}">`;
    }
    return `<label class="block mb-1 text-xs font-bold text-gray-500 uppercase">${f.label}</label>${inputHtml}`;
  }).join('');

  showModal(`
    <div class="bg-white rounded-2xl shadow-2xl overflow-hidden max-w-lg w-full mx-auto">
      <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
        <h3 class="text-lg font-bold text-gray-800">${isEdit?'Edit':'Tambah'} ${mod.label}</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
      </div>
      <div class="p-6 max-h-[75vh] overflow-y-auto">
        ${(!isEdit && prefill) ? `<div class="mb-4 p-3 bg-emerald-50 border border-emerald-100 rounded-xl text-xs text-emerald-700 font-semibold flex items-center gap-2"><i class="fas fa-qrcode"></i> Data siswa terisi otomatis dari hasil scan QR</div>` : ''}
        <form onsubmit="saveRecord(event, ${isEdit})">
          ${fieldsHtml}
          ${isEdit ? `<input type="hidden" name="id" value="${record.id}">` : ''}
          <div class="flex justify-end gap-3 pt-2 border-t border-gray-100 mt-2">
            <button type="button" onclick="closeModal()" class="px-5 py-2.5 rounded-xl text-gray-600 font-medium hover:bg-gray-100">Batal</button>
            <button type="submit" class="px-5 py-2.5 bg-indigo-600 text-white rounded-xl font-bold shadow-lg hover:bg-indigo-700">Simpan</button>
          </div>
        </form>
      </div>
    </div>`);
}

function saveRecord(e, isEdit) {
  e.preventDefault();
  const mod = MODULES[currentModuleKey];
  const fd = new FormData(e.target);
  const data = {};
  mod.fields.forEach(f => data[f.key] = fd.get(f.key) || '');

  showLoading();
  const promise = isEdit
    ? callGAS('updateRecord', mod.sheet, fd.get('id'), data)
    : callGAS('addRecord', mod.sheet, data);

  promise.then(res => {
    hideLoading();
    if (res.success) {
      closeModal();
      moduleCache[currentModuleKey] = null;
      loadModuleData();
      showAlert('success', isEdit ? 'Data berhasil diperbarui' : 'Data berhasil ditambahkan');
    } else {
      showAlert('error', res.message || 'Gagal menyimpan data');
    }
  }).catch(err => { hideLoading(); showAlert('error', 'Gagal koneksi: ' + err.message); });
}

function deleteRecord(id) {
  const mod = MODULES[currentModuleKey];
  Swal.fire({
    title: 'Hapus data ini?', text: 'Tindakan ini tidak dapat dibatalkan.', icon: 'warning',
    showCancelButton: true, confirmButtonColor: '#ef4444', cancelButtonColor: '#6b7280',
    confirmButtonText: 'Ya, Hapus', cancelButtonText: 'Batal'
  }).then(r => {
    if (!r.isConfirmed) return;
    showLoading();
    callGAS('deleteRecord', mod.sheet, id).then(res => {
      hideLoading();
      if (res.success) { moduleCache[currentModuleKey] = null; loadModuleData(); showAlert('success','Data dihapus'); }
      else showAlert('error', res.message);
    }).catch(err => { hideLoading(); showAlert('error', 'Gagal koneksi: ' + err.message); });
  });
}

/* ============================================================
   SCAN QR SISWA
   Pola kode QR siswa: SIS0001, SIS0002, dst (di-generate dari sistem
   kartu siswa). Dipakai untuk mengisi otomatis NISN/Nama/Kelas pada
   form modul, dan sebagai jalan pintas aksi cepat sesuai peran user.
   ============================================================ */
const QR_CODE_PATTERN = /^SIS\d+$/i;

function openQrScanner(onDecode) {
  window._qrOnDecode = onDecode;
  showModal(`
    <div class="bg-white rounded-2xl shadow-2xl overflow-hidden max-w-md w-full mx-auto">
      <div class="p-6 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
        <h3 class="text-lg font-bold text-gray-800"><i class="fas fa-qrcode mr-2 text-emerald-600"></i>Pindai QR Siswa</h3>
        <button onclick="closeQrScanner()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
      </div>
      <div class="p-6">
        <div id="qrReaderBox" class="rounded-xl overflow-hidden border border-gray-200 bg-black/5 min-h-[220px] flex items-center justify-center">
          <p class="text-xs text-gray-400"><i class="fas fa-circle-notch fa-spin mr-2"></i>Mengaktifkan kamera...</p>
        </div>
        <p class="text-[11px] text-gray-500 mt-3 text-center">Arahkan kamera ke QR pada kartu siswa (pola SIS0001, SIS0002, dst).</p>
        <div class="mt-4 pt-4 border-t border-gray-100">
          <label class="block mb-1 text-xs font-bold text-gray-500 uppercase">Atau masukkan kode manual</label>
          <div class="flex gap-2">
            <input type="text" id="qrManualCode" placeholder="cth: SIS0001" class="flex-1 bg-gray-50 border border-gray-200 text-sm rounded-lg p-2.5" onkeydown="if(event.key==='Enter'){event.preventDefault();submitManualQr();}">
            <button type="button" onclick="submitManualQr()" class="px-4 bg-indigo-600 text-white rounded-lg text-xs font-bold">Cari</button>
          </div>
        </div>
      </div>
    </div>`);

  try {
    window._qrScanner = new Html5Qrcode('qrReaderBox');
    window._qrScanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: 220 },
      (decodedText) => handleQrDecoded(decodedText),
      () => { /* abaikan frame gagal decode */ }
    ).catch(() => {
      const box = document.getElementById('qrReaderBox');
      if (box) box.innerHTML = '<p class="text-xs text-red-500 text-center px-4">Kamera tidak dapat diakses. Gunakan input kode manual di bawah.</p>';
    });
  } catch (err) {
    const box = document.getElementById('qrReaderBox');
    if (box) box.innerHTML = '<p class="text-xs text-red-500 text-center px-4">Kamera tidak tersedia di perangkat ini. Gunakan input kode manual di bawah.</p>';
  }
}

function submitManualQr() {
  const el = document.getElementById('qrManualCode');
  const val = el ? el.value.trim() : '';
  if (val) handleQrDecoded(val);
}

function handleQrDecoded(code) {
  const cb = window._qrOnDecode;
  stopQrScanner();
  closeModal();
  if (cb) cb(String(code).trim());
}

function stopQrScanner() {
  if (window._qrScanner) {
    try {
      window._qrScanner.stop().then(() => { try { window._qrScanner.clear(); } catch(e){} }).catch(()=>{});
    } catch (e) { /* noop */ }
    window._qrScanner = null;
  }
}

function closeQrScanner() { stopQrScanner(); closeModal(); }

function lookupStudentByQr(code, onFound) {
  if (!QR_CODE_PATTERN.test(code)) {
    showAlert('error', 'Format kode QR tidak dikenali. Gunakan pola SIS0001, SIS0002, dst.');
    return;
  }
  showLoading();
  callGAS('getSiswaByQrId', code.toUpperCase()).then(res => {
    hideLoading();
    if (!res.success) { showAlert('error', res.message || 'Data siswa tidak ditemukan.'); return; }
    onFound(res.data);
  }).catch(err => { hideLoading(); showAlert('error', 'Gagal koneksi: ' + err.message); });
}

/* Scan QR global di header — cocok untuk semua peran, menampilkan
   pilihan aksi cepat sesuai modul yang boleh diakses peran user. */
function openGlobalScan() {
  openQrScanner(code => {
    lookupStudentByQr(code, siswa => showStudentQuickActions(siswa));
  });
}

function showStudentQuickActions(siswa) {
  const role = currentUser.role;
  const modsForRole = Object.entries(MODULES).filter(([k, m]) => m.qrEnabled && (role === 'admin' || m.roles.includes(role)));

  const actionsHtml = modsForRole.length ? modsForRole.map(([key, mod]) => `
    <button onclick='useQuickAction("${key}", ${JSON.stringify(siswa)})' class="w-full text-left p-3 bg-gray-50 hover:bg-indigo-50 rounded-xl border border-gray-100 flex items-center gap-3 mb-2 transition">
      <div class="text-indigo-500 bg-indigo-100 p-2 rounded-lg"><i class="fas ${mod.icon}"></i></div>
      <div><p class="text-sm font-bold text-gray-800">${mod.label}</p><p class="text-[10px] text-gray-500">Tambah data baru untuk siswa ini</p></div>
    </button>`).join('') : '<p class="text-xs text-gray-400 text-center py-4">Tidak ada modul yang mendukung QR untuk peran Anda.</p>';

  // Tabel ringkas seluruh data siswa dari sheet Siswa (dinamis,
  // mengikuti field apa pun yang tersedia pada hasil lookup).
  const displayLabels = {
    nisn: 'NISN', namaSiswa: 'Nama Siswa', kelas: 'Kelas',
    jenisKelamin: 'Jenis Kelamin', noHp: 'No. HP', alamat: 'Alamat', qrId: 'Kode QR'
  };
  const hiddenKeys = ['id', 'nama'];
  const detailRows = Object.keys(displayLabels)
    .filter(k => siswa[k] !== undefined && !hiddenKeys.includes(k))
    .map(k => `
      <div class="flex justify-between gap-3 py-1.5 border-b border-gray-50 last:border-0">
        <span class="text-[11px] text-gray-500 font-semibold">${displayLabels[k]}</span>
        <span class="text-xs text-gray-800 text-right">${escapeHtml(String(siswa[k] || '-'))}</span>
      </div>`).join('');

  showModal(`
    <div class="bg-white rounded-2xl shadow-2xl overflow-hidden max-w-md w-full mx-auto">
      <div class="p-6 border-b border-gray-100 bg-gray-50/50">
        <h3 class="text-lg font-bold text-gray-800 mb-1"><i class="fas fa-id-card mr-2 text-indigo-600"></i>Data Siswa Ditemukan</h3>
        <p class="text-sm text-gray-700 font-semibold">${escapeHtml(siswa.namaSiswa || '-')}</p>
      </div>
      <div class="p-6 max-h-[75vh] overflow-y-auto">
        <div class="bg-gray-50/60 border border-gray-100 rounded-xl p-3 mb-4">${detailRows}</div>
        <p class="text-[10px] font-bold text-gray-400 uppercase mb-2">Pilih Tindakan</p>
        ${actionsHtml}
        <button onclick="closeModal()" class="w-full mt-2 px-5 py-2.5 rounded-xl text-gray-600 font-medium hover:bg-gray-100">Batal</button>
      </div>
    </div>`);
}

function useQuickAction(moduleKey, siswa) {
  closeModal();
  openModule(moduleKey);
  setTimeout(() => openRecordModal(null, siswa), 200);
}

/* ============================================================
   UI HELPERS
   ============================================================ */
function showLoading() { document.getElementById('loadingOverlay').classList.remove('hidden'); }
function hideLoading() { document.getElementById('loadingOverlay').classList.add('hidden'); }
function showModal(content) {
  document.getElementById('modalContainer').innerHTML = `
    <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
      <div class="absolute inset-0 bg-gray-900/60 backdrop-blur-sm" onclick="closeModal()"></div>
      <div class="relative w-full max-w-lg animate-fade-in">${content}</div>
    </div>`;
}
function closeModal() { document.getElementById('modalContainer').innerHTML = ''; }
function showAlert(type, message) {
  const bg = type === 'success' ? 'bg-green-600' : 'bg-red-600';
  const div = document.createElement('div');
  div.className = `fixed top-6 right-6 ${bg} text-white px-6 py-4 rounded-xl shadow-2xl z-[80] flex items-center font-medium animate-fade-in`;
  div.innerHTML = `<i class="fas fa-${type==='success'?'check-circle':'exclamation-circle'} mr-3 text-xl"></i> ${message}`;
  document.body.appendChild(div);
  setTimeout(() => { div.style.opacity='0'; setTimeout(()=>div.remove(),300); }, 3000);
}

checkSession();
